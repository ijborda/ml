version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-platform-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.ml-imarijoyborda-secure.rule=Host(`ml.imarijoyborda.com`)"
      - "traefik.http.routers.ml-imarijoyborda-secure.entrypoints=websecure"
      - "traefik.http.routers.ml-imarijoyborda-secure.tls=true"
      - "traefik.http.routers.ml-imarijoyborda-secure.tls.certresolver=myresolver"
      - "traefik.http.services.ml-imarijoyborda-secure.loadbalancer.server.port=3000"
      # HTTP to HTTPS redirection
      - "traefik.http.routers.ml-imarijoyborda.rule=Host(`ml.imarijoyborda.com`)"
      - "traefik.http.routers.ml-imarijoyborda.entrypoints=web"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.ml-imarijoyborda.middlewares=redirect-to-https"
    environment:
      NODE_ENV: production
      ML_API_URL: http://ml-api:8000
      API_LIMIT_WINDOW_SECONDS: 60
      API_LIMIT_MAX_REQUESTS: 10
    depends_on:
      - ml-api
    networks:
      - traefik_net
      - default

  ml-api:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: ml-platform-api
    environment:
      MODEL_ROOT: /app/models

networks:
  traefik_net:
    external: true
